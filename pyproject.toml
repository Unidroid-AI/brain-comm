[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-comm"
version = "1.0.0"
description = "Communication between a Unidroid tournament brain and the simulator."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "Unidroid"}]
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
brain-comm = "brain_comm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_comm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
